<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波比集团 LOGO 选择器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f172a; color:#e2e8f0; font-family:sans-serif; min-height:100vh; padding:40px 20px; }
  h1 { text-align:center; font-size:28px; margin-bottom:8px; }
  .sub { text-align:center; color:#64748b; margin-bottom:32px; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:20px; max-width:1000px; margin:0 auto; }
  .card { background:#1e293b; border:2px solid #334155; border-radius:16px; padding:24px; cursor:pointer; transition:all .25s; text-align:center; }
  .card:hover { border-color:#6366f1; transform:translateY(-4px); box-shadow:0 8px 30px rgba(99,102,241,.2); }
  .card.selected { border-color:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.3); }
  .card img { width:120px; height:120px; object-fit:contain; margin-bottom:12px; }
  .card h3 { font-size:14px; color:#94a3b8; }
  .card .badge { display:inline-block; padding:2px 10px; border-radius:10px; font-size:11px; font-weight:700; margin-top:8px; }
  .badge.selected { background:#22c55e; color:#000; }
  .badge.default { background:#6366f1; color:#fff; }
  .actions { text-align:center; margin-top:32px; }
  .btn { padding:12px 32px; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; margin:0 8px; transition:all .2s; }
  .btn-apply { background:#6366f1; color:#fff; }
  .btn-apply:hover { background:#4f46e5; }
  .btn-reset { background:#334155; color:#fff; }
  .btn-reset:hover { background:#475569; }
  .tip { text-align:center; color:#64748b; font-size:13px; margin-top:16px; }
</style>
</head>
<body>
<h1>🎨 选择 LOGO</h1>
<p class="sub">点击卡片预览，选择后点击"应用"生效 | 共 8 款简约设计</p>

<div class="grid" id="grid"></div>

<div class="actions">
  <button class="btn btn-apply" onclick="applyLogo()">✅ 应用选中 LOGO</button>
  <button class="btn btn-reset" onclick="resetLogo()">🔄 恢复默认</button>
</div>
<p class="tip">选择后会保存到本地存储，下次打开自动生效</p>

<script>
var logos = [
  { id:'b1.svg', name:'🏛️ 六边形·B字', desc:'对称六边形 / B字母抽象 + 隐藏三角' },
  { id:'b2.svg', name:'⭕ 双环交汇', desc:'黄金比例双圆 / 菱形核心' },
  { id:'b3.svg', name:'🔲 方框·B标', desc:'双层方框 / 大写B字母视觉' },
  { id:'b4.svg', name:'🔵 圆环·像素B', desc:'极简圆环 / B字像素化' },
  { id:'b5.svg', name:'🔶 六边形·柱状', desc:'六边形外框 / 渐变色柱' },
  { id:'b6.svg', name:'📊 三柱·对称', desc:'三列胶囊柱 / 均衡对称' },
];

var selected = localStorage.getItem('bobi_logo') || 'logo.svg';
var grid = document.getElementById('grid');

logos.forEach(function(l) {
  var card = document.createElement('div');
  card.className = 'card' + (selected === l.id ? ' selected' : '');
  card.onclick = function() {
    document.querySelectorAll('.card').forEach(function(c) { c.classList.remove('selected'); });
    card.classList.add('selected');
    selected = l.id;
  };
  card.innerHTML = '<img src="img/' + l.id + '" alt="' + l.name + '">' +
    '<h3>' + l.name + '</h3>' +
    '<p style="font-size:12px;color:#64748b;margin-top:4px;">' + l.desc + '</p>' +
    '<span class="badge ' + (selected === l.id ? 'selected' : 'default') + '">' + (selected === l.id ? '已选中' : '点击选择') + '</span>';
  grid.appendChild(card);
});

function applyLogo() {
  localStorage.setItem('bobi_logo', selected);
  alert('LOGO 已应用！\n即将跳转回首页。');
  window.location.href = 'index.html';
}

function resetLogo() {
  localStorage.setItem('bobi_logo', 'logo.svg');
  selected = 'logo.svg';
  document.querySelectorAll('.card').forEach(function(c) {
    c.classList.remove('selected');
    if (c.querySelector('img').src.includes('logo.svg')) c.classList.add('selected');
  });
  alert('已恢复默认 LOGO');
}
</script>
</body>
</html>
