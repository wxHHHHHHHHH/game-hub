# ============================================
# GameHub - Nginx Configuration (Production)
# ============================================
# Copy to: /etc/nginx/sites-available/gamehub
# Enable:  ln -s /etc/nginx/sites-available/gamehub /etc/nginx/sites-enabled/
# Test:    nginx -t && systemctl reload nginx
# ============================================

server {
    listen 80;
    server_name your-domain.com;  # CHANGE THIS

    # Frontend static files
    root /opt/gamehub/frontend;
    index index.html;

    # Uploaded video files (HLS segments, original files)
    location /uploads/ {
        alias /var/gamehub/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # CORS for DPlayer HLS playback
        add_header Access-Control-Allow-Origin *;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API reverse proxy to Spring Boot backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large file upload support
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 2048m;
    }

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json text/css application/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_proxied any;
}

