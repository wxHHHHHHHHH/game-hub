<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8102E"/>
      <stop offset="50%" stop-color="#E2363C"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#F5B642"/>
      <stop offset="100%" stop-color="#E89020"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 外圆环 -->
  <circle cx="120" cy="120" r="110" stroke="url(#g1)" stroke-width="6" fill="none" opacity="0.3"/>
  <circle cx="120" cy="120" r="100" stroke="url(#g1)" stroke-width="3" fill="none"/>

  <!-- 底部弧形装饰 -->
  <path d="M40 140 Q120 180 200 140" stroke="url(#g2)" stroke-width="2.5" fill="none" opacity="0.6"/>

  <!-- 主文字 "波" -->
  <text x="120" y="118" text-anchor="middle" font-family="SimHei,Microsoft YaHei,Noto Sans SC,sans-serif"
        font-size="88" font-weight="900" fill="url(#g1)" filter="url(#shadow)"
        letter-spacing="0">波</text>

  <!-- 小字 "比" -->
  <text x="120" y="168" text-anchor="middle" font-family="SimHei,Microsoft YaHei,Noto Sans SC,sans-serif"
        font-size="34" font-weight="700" fill="url(#g2)"
        letter-spacing="0">比</text>

  <!-- 底部集团名称 -->
  <text x="120" y="225" text-anchor="middle" font-family="SimHei,Microsoft YaHei,Noto Sans SC,sans-serif"
        font-size="18" font-weight="700" fill="#C8102E" letter-spacing="6">中国波比集团</text>
</svg>
