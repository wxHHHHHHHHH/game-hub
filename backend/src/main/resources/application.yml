# ============================================
# GameHub - Default (Local) Configuration
# ============================================
# Run: mvn spring-boot:run
# Active profile: local (default)

spring:
  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:35087/gamehub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: Root@123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  servlet:
    multipart:
      enabled: true
      max-file-size: 2048MB
      max-request-size: 2048MB

server:
  port: 27890

# Upload directory
gamehub:
  upload-dir: E:/game-hub/uploads

# JWT config
jwt:
  secret: GameHub@2024_SecretKey_ChangeThisInProduction_AtLeast32Chars!!
  expiration: 604800000  # 7 days in milliseconds

# Logging
logging:
  level:
    com.gamehub: DEBUG
    org.springframework.security: INFO
