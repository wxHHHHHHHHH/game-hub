# ============================================
# GameHub - Production Configuration
# ============================================
# Run: mvn spring-boot:run -Dspring-boot.run.profiles=prod
#  or: java -jar game-hub.jar --spring.profiles.active=prod

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:35087}/${DB_NAME:gamehub}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Don't auto-modify production DB
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26379}
      timeout: 3000ms

  sql:
    init:
      mode: never  # Don't run seed data in production

  servlet:
    multipart:
      enabled: true
      max-file-size: 2048MB
      max-request-size: 2048MB

server:
  port: ${SERVER_PORT:27890}
  compression:
    enabled: true
    mime-types: application/json,text/css,application/javascript

# Upload directory
gamehub:
  upload-dir: ${UPLOAD_DIR:/var/gamehub/uploads}

# JWT config - MUST CHANGE in production!
jwt:
  secret: ${JWT_SECRET:GameHub@2024_SecretKey_ChangeThisInProduction_AtLeast32Chars!!}
  expiration: 604800000

# Logging - less verbose in production
logging:
  level:
    com.gamehub: INFO
    org.springframework.security: WARN
