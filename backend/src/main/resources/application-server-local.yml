# ============================================
# GameHub - 服务器部署配置（端口写死）
# IDEA 启动: -Dspring.profiles.active=server-local
# 服务器启动: java -jar xxx.jar --spring.profiles.active=server-local
# ============================================
server:
  port: 27890

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:41728/gamehub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: Mall@2024!
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update  # 首次启动自动建表，之后改 validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: 127.0.0.1
      port: 52936

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  servlet:
    multipart:
      enabled: true
      max-file-size: 2048MB
      max-request-size: 2048MB

gamehub:
  upload-dir: /opt/gamehub/uploads

jwt:
  secret: GameHub@2024_SecretKey_ChangeThisInProduction_AtLeast32Chars!!
  expiration: 604800000

logging:
  level:
    com.gamehub: INFO
